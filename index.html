<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#246b4b"><title>Viaje de Bea · México 2026</title>
<link rel="stylesheet" href="style.css?v=20261028c"></head>
<body><header><div class="top"><div><span class="eyebrow">MÉXICO · 2026</span><h1 id="title">El viaje de Bea 🇲🇽</h1><p id="subtitle">22 de octubre — 9 de noviembre</p></div><div class="lang"><button id="es" class="active">🇲🇽 ES</button><button id="pt">🇧🇷 PT</button></div></div>
<div class="hero"><div><b id="daysLabel">19 días de viaje</b><span id="route">CDMX · Querétaro · Guanajuato · San Miguel · Sierra Gorda</span></div><button id="todayBtn">✨ Ver hoy</button><div class="countdown" id="countdown" aria-live="polite"></div></div></header>
<main><nav id="filters"></nav><section id="notice"></section><section id="timeline"></section><section class="budget" id="budget"></section></main>
<footer><b>Viaje de Bea · México 2026</b><span id="footerText">Hecho para disfrutar el viaje, no para correr ✨</span></footer>
<script src="app.js?v=20261028c"></script>
<style>
.traffic{margin:0 0 18px;padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 14px #513b2210}.traffic h2{font-size:20px;margin:0 0 6px}.traffic p{line-height:1.5;margin:8px 0;font-size:14px}.traffic .traffic-rule{color:var(--nopal2);font-weight:750}.traffic .traffic-pending{background:#fff0bd;border-radius:10px;padding:12px;color:#65450b}.traffic .traffic-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.traffic a{min-height:44px;padding:11px 14px;border:1px solid #cfe3f5;border-radius:11px;background:#eaf4ff;color:#12588f;font-size:13px;font-weight:750;text-decoration:none}.traffic small{display:block;color:var(--muted);line-height:1.5;margin-top:12px}
</style>
<script>
(function(){
  const card=document.createElement("section");
  card.className="traffic";card.id="traffic";card.setAttribute("aria-labelledby","traffic-title");
  document.getElementById("notice").before(card);
  const copy={
    es:{title:"🚗 Hoy No Circula · CDMX",date:"Estancia en CDMX: 22–25 de octubre de 2026",rule:"Confirmado en foto: placa UPC472K de Querétaro, engomado verde y holograma 0 del año 2026.",detail:"Con holograma 0 vigente pueden circular jueves, viernes, sábado y domingo bajo el programa habitual. Llevar el certificado de verificación, tarjeta de circulación y licencia.",pending:"⚠️ Contingencia ambiental: pendiente de consultar. Puede restringir también al holograma 0 según la terminación de placa.",note:"Estado revisado por tareas programadas; no es una consulta en tiempo real. La foto no muestra la fecha exacta del certificado, por lo que conviene llevarlo para acreditar su vigencia. Revisar el comunicado oficial antes de cada salida.",came:"Consultar contingencias CAMe ↗",sedema:"Reglas oficiales SEDEMA ↗",updated:"Reglas consultadas: 19 de octubre de 2026."},
    pt:{title:"🚗 Hoy No Circula · CDMX",date:"Estadia na CDMX: 22–25 de outubro de 2026",rule:"Confirmado pela foto: placa UPC472K de Querétaro, adesivo verde e holograma 0 do ano de 2026.",detail:"Com o holograma 0 válido, o carro pode circular de quinta a domingo sob o programa habitual. Levar o certificado de inspeção, documento do veículo e habilitação.",pending:"⚠️ Contingência ambiental: consulta pendente. Pode restringir também o holograma 0 conforme o final da placa.",note:"Estado consultado por tarefas programadas; não é uma consulta em tempo real. A foto não mostra a data exata do certificado, por isso é recomendável levá-lo para comprovar a validade. Consultar o comunicado oficial antes de cada saída.",came:"Consultar contingências CAMe ↗",sedema:"Regras oficiais SEDEMA ↗",updated:"Regras consultadas em 19 de outubro de 2026."}
  };
  let trafficStatus=null;
  function updateTraffic(){
    const t=copy[lang==="pt"?"pt":"es"];
    card.innerHTML='<h2 id="traffic-title">'+t.title+'</h2><p>'+t.date+'</p><p class="traffic-rule">'+t.rule+'</p><p>'+t.detail+'</p><p class="traffic-pending">'+t.pending+'</p><div class="traffic-links"><a href="https://www.gob.mx/comisionambiental/archivo/prensa" target="_blank" rel="noopener noreferrer">'+t.came+'</a><a href="https://sedema.cdmx.gob.mx/programas/programa/verificacion-vehicular" target="_blank" rel="noopener noreferrer">'+t.sedema+'</a></div><small>'+t.note+' '+t.updated+'</small>';
    const live=document.createElement("div");
    live.setAttribute("aria-live","polite");
    const now=Date.now(),checked=trafficStatus&&Date.parse(trafficStatus.checked_at);
    const expiry=trafficStatus&&Date.parse(trafficStatus.valid_until);
    const fresh=Number.isFinite(checked)&&checked<=now+300000&&now-checked<26*3600000&&Number.isFinite(expiry)&&expiry>now;
    const p=document.createElement("p");p.className="traffic-pending";
    p.textContent=fresh ? (lang==="pt"?trafficStatus.pt:trafficStatus.es) : (lang==="pt"?"⚠️ Estado atual sem confirmação recente. Consulte a CAMe antes de sair.":"⚠️ Estado actual sin confirmación reciente. Consulta CAMe antes de salir.");
    live.append(p);
    if(Number.isFinite(checked)){
      const stamp=document.createElement("small");
      stamp.textContent=(lang==="pt"?"Última consulta: ":"Última revisión: ")+new Intl.DateTimeFormat(lang==="pt"?"pt-BR":"es-MX",{dateStyle:"medium",timeStyle:"short",timeZone:"America/Mexico_City"}).format(new Date(checked));
      live.append(stamp);
    }
    if(fresh&&trafficStatus.source_url){
      try{const u=new URL(trafficStatus.source_url);
        if(u.protocol==="https:"&&(u.hostname==="www.gob.mx"||u.hostname==="gob.mx"||u.hostname==="sedema.cdmx.gob.mx"||u.hostname==="www.sedema.cdmx.gob.mx")){
          const link=document.createElement("a");link.href=u.href;link.target="_blank";link.rel="noopener noreferrer";link.textContent=lang==="pt"?"Ver comunicado consultado ↗":"Ver comunicado consultado ↗";live.append(link);
        }
      }catch(e){}
    }
    const pending=card.querySelector(".traffic-pending");
    pending.replaceWith(live);
  }
  document.getElementById("es").addEventListener("click",updateTraffic);
  document.getElementById("pt").addEventListener("click",updateTraffic);
  async function refreshTraffic(){
    try{
      const response=await fetch("/traffic-status.json",{cache:"no-store"});
      if(!response.ok)throw new Error("Status unavailable");
      const data=await response.json();
      if(!["unknown","clear","contingency"].includes(data.status)||typeof data.es!=="string"||typeof data.pt!=="string")throw new Error("Invalid status");
      trafficStatus=data;
    }catch(e){trafficStatus=null;}
    updateTraffic();
  }
  updateTraffic();
  refreshTraffic();
  setInterval(refreshTraffic,300000);
})();
</script>
</body></html>
